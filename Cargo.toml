[package]
name = "mcp-server-template"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Template for building MCP servers as WebAssembly components (wasi:http@0.3.0 / WASI p3)"
license = "Apache-2.0"
repository = "https://github.com/cosmonic-labs/mcp-server-template-rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Official Model Context Protocol SDK. The streamable-http-server transport is
# pure `http`/`http-body` types (no hyper/axum), so it compiles to wasm32-wasip2.
rmcp = { version = "3.1.1", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
] }

# WASI 0.3 bindings: exports the `wasi:http@0.3.0` service world and bridges
# to hyperium `http` types via `http_compat`.
wasip3 = { version = "0.7.0", features = ["http-compat"] }

http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"

# rmcp drives its session/dispatch machinery with tokio primitives; on
# wasm32-wasip2 we run a single-threaded runtime. Outbound I/O goes through
# the wasi:http bindings (see src/bridge.rs), not tokio::net — if you add the
# `net` feature for raw TCP, the `tokio_unstable` cfg in .cargo/config.toml
# already enables its wasm support.
tokio = { version = "1.50", features = ["rt", "macros", "sync", "time", "io-util"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"

# Observability: structured JSON logs on stderr. The wasmCloud / Cosmonic host
# captures stderr and exports it as OTLP log records when OTEL is enabled.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
    "json",
    "registry",
] }

# Optional native wasi:otel support (`--features wasi-otel`): guest spans are
# reported to the host via the wasi:otel@0.2.0-rc.2 interfaces and join the
# host's traces. Requires a host that implements wasi:otel (wasmCloud v2 /
# Cosmonic Control); plain `wasmtime serve` does not.
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", default-features = false, features = [
    "trace",
], optional = true }
opentelemetry-wasi = { git = "https://github.com/bytecodealliance/opentelemetry-wasi", rev = "2962a286aa66", optional = true }
tracing-opentelemetry = { version = "0.32", default-features = false, optional = true }

[features]
default = []
wasi-otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-wasi",
    "dep:tracing-opentelemetry",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
