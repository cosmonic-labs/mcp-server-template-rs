version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: cargo
    directory: /
    cooldown:
      default-days: 7
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    patterns: ["*"]
    multi-ecosystem-group: dependencies
