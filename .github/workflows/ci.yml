name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Build component
        run: cargo build --release

      - name: Check wasi-otel feature
        run: cargo check --release --features wasi-otel

      - name: Verify wasi:http@0.3.0 handler export
        run: |
          cargo install wasm-tools --locked
          wasm-tools component wit target/wasm32-wasip2/release/mcp_server_template.wasm | tee /tmp/world.wit
          grep -q 'export wasi:http/handler@0.3.0' /tmp/world.wit

      - name: End-to-end protocol suite
        run: |
          curl -sSfL https://github.com/bytecodealliance/wasmtime/releases/download/v46.0.1/wasmtime-v46.0.1-x86_64-linux.tar.xz | tar -xJ
          echo "$PWD/wasmtime-v46.0.1-x86_64-linux" >> "$GITHUB_PATH"
          export PATH="$PWD/wasmtime-v46.0.1-x86_64-linux:$PATH"
          cargo install wasm-tools --locked || true
          scripts/e2e.sh --no-build
