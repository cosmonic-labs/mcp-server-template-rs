name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  WASMTIME_VERSION: 49.0.3
  WASM_TOOLS_VERSION: 1.262.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Build component
        run: cargo build --release

      - name: Check wasi-otel feature
        run: cargo check --release --features wasi-otel

      - name: Verify wasi:http@0.3.0 handler export
        run: |
          cargo install wasm-tools --version "$WASM_TOOLS_VERSION" --locked
          wasm-tools component wit target/wasm32-wasip2/release/mcp_server_template.wasm | tee /tmp/world.wit
          grep -q 'export wasi:http/handler@0.3.0' /tmp/world.wit

      - name: End-to-end protocol suite
        run: |
          curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz" | tar -xJ
          export PATH="$PWD/wasmtime-v${WASMTIME_VERSION}-x86_64-linux:$PATH"
          scripts/e2e.sh --no-build
